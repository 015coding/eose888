name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      DATABASE_MAIN_URL: ${{ secrets.DATABASE_MAIN_URL }}
      MONGODB_URI_LOG_LOGIN: ${{ secrets.MONGODB_URI_LOG_LOGIN }}
      STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci


      - name: Generate Prisma client
        run: | 
            npx prisma generate --schema=./prisma/schema.prisma
            npx prisma generate --schema=./prisma-App/schema.prisma


      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
